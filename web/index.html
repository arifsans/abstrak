<!DOCTYPE html>
<html>

<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="abstrak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Captive</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <div id="loading">
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, sans-serif;
      }

      /* Loader text effect */
      .loader {
        font-size: 40px;
        font-weight: bold;
        text-transform: uppercase;
        color: #0000;
        -webkit-text-stroke: 1px #fff;
        background: linear-gradient(90deg, #0000 33%, #fff 0 67%, #0000 0) 0/300% 100% no-repeat text;
        animation: l2 2s linear infinite;
      }

      .loader:before {
        content: "Starting Engine...";
      }

      @keyframes l2 {
        0% {
          background-position: 100%
        }

        100% {
          background-position: 0%
        }
      }

      /* Progress bar */
      .progress-container {
        margin-top: 20px;
        width: 60%;
        max-width: 300px;
        height: 10px;
        background: #333;
        border-radius: 5px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: #00bcd5;
        transition: width 0.2s ease;
      }

      .progress-text {
        margin-top: 10px;
        font-size: 14px;
        color: #fff;
      }
    </style>

    <div class="loader"></div>
    <div class="progress-container">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="progress-text" id="progress-text">0%</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    let fakeProgress = 0;
    const progressBar = document.getElementById("progress-bar");
    const progressText = document.getElementById("progress-text");

    const interval = setInterval(() => {
      if (fakeProgress < 99) {
        fakeProgress += 1 * 10;
        if (fakeProgress > 99) fakeProgress = 99;
        progressBar.style.width = fakeProgress + "%";
        progressText.textContent = Math.floor(fakeProgress) + "%";
      }
    }, 180);

    // Flutter app ready
    window.addEventListener("flutter-first-frame", function () {
      clearInterval(interval);
      progressBar.style.width = "100%";
      progressText.textContent = "100%";
      setTimeout(() => {
        document.getElementById("loading").remove();
      }, 300);
    });

    // Bootstrap Flutter
    window.addEventListener('load', function () {
      _flutter.loader.load({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function (engineInitializer) {
          engineInitializer.initializeEngine().then(function (appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>

</html>
